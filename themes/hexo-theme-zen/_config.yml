favicon: favicon.jpg

menu:
  首页: /
  标签: /tags/
  关于: about.html
  关于网站: /about-website/

copyright:
  name: Yojigen.Tech

# twikoo 评论系统配置
twikoo:
  enable: true
  # 腾讯云环境填 envId；Vercel 环境填地址（https://xxx.vercel.app）
  envId : 您的环境id
  # 环境地域，默认为 ap-shanghai，腾讯云环境填 ap-shanghai 或 ap-guangzhou；Vercel 环境不填
  region: ap-guangzhou
  # 用于手动设定评论区语言，支持的语言列表 https://github.com/twikoojs/twikoo/blob/main/src/client/utils/i18n/index.js
  lang: zh-CN

# beaudar 评论系统配置
beaudar:
  enable: true
  # 填写用于 beaudar 评论系统的 github repo 地址
  repo : mouyase/Yojigen.Tech
  # 填写用于 beaudar 评论系统的分支
  branch: main

# 页脚访问统计配置：PV 为累计浏览量，UV 为所选时区内的每日独立访客数。
site_stats:
  enable: true
  endpoint: https://pv.eth0.bond
  time_zone: Asia/Shanghai
